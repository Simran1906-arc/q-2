<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regular Expression Matching</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0e14;
    --surface: #13151f;
    --card: #1a1d2b;
    --border: #252836;
    --accent: #00d4aa;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --text: #e8eaf0;
    --muted: #6b7280;
    --true: #00d4aa;
    --false: #ff6b6b;
    --invalid: #ffd166;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    background-image:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(0,212,170,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 80% 90%, rgba(255,107,107,0.05) 0%, transparent 60%);
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  header .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.8;
  }

  header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--text) 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Examples Grid ── */
  .examples-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 36px;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  @media (max-width: 580px) {
    .examples-grid { grid-template-columns: 1fr; }
  }

  .example-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    position: relative;
    overflow: hidden;
  }

  .example-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .example-card.ex1::before { background: linear-gradient(90deg, var(--accent), transparent); }
  .example-card.ex2::before { background: linear-gradient(90deg, var(--accent2), transparent); }

  .example-card .ex-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .io-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }

  .io-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    width: 56px;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .io-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    flex: 1;
    word-break: break-all;
  }

  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 20px;
    letter-spacing: 1px;
  }
  .badge.true  { background: rgba(0,212,170,0.15); color: var(--true); border: 1px solid rgba(0,212,170,0.3); }
  .badge.false { background: rgba(255,107,107,0.15); color: var(--false); border: 1px solid rgba(255,107,107,0.3); }
  .badge.invalid { background: rgba(255,209,102,0.15); color: var(--invalid); border: 1px solid rgba(255,209,102,0.3); }

  /* ── Playground ── */
  .playground {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .playground-title {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }

  @media (max-width: 480px) { .input-row { grid-template-columns: 1fr; } }

  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 2px;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,170,0.08);
  }

  .field input::placeholder { color: var(--muted); letter-spacing: 1px; font-size: 13px; }

  .run-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #0c0e14;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 24px;
  }

  .run-btn:hover { opacity: 0.88; }
  .run-btn:active { transform: scale(0.98); }

  /* ── Result Panel ── */
  .result-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    display: none;
    animation: pop 0.3s cubic-bezier(.34,1.56,.64,1) both;
  }

  .result-panel.visible { display: block; }

  .result-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .result-explanation {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 4px;
  }

  /* ── Steps trace ── */
  .steps {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .step-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .step-chip.match { color: var(--accent); border-color: rgba(0,212,170,0.3); background: rgba(0,212,170,0.05); }

  @keyframes fadeDown { from { opacity:0; transform: translateY(-16px); } to { opacity:1; transform: none; } }
  @keyframes fadeUp   { from { opacity:0; transform: translateY(16px);  } to { opacity:1; transform: none; } }
  @keyframes pop      { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="label">Question 2</div>
    <h1>Regular Expression Matching</h1>
    <p>'+' matches one or more of the preceding element &nbsp;·&nbsp; full string must match</p>
  </header>

  <!-- Pre-built Examples -->
  <div class="examples-grid">

    <!-- Example 1 -->
    <div class="example-card ex1">
      <div class="ex-label">Example 1</div>
      <div class="io-row">
        <span class="io-key">P =</span>
        <span class="io-val">AAAB</span>
      </div>
      <div class="io-row">
        <span class="io-key">Q =</span>
        <span class="io-val">A+B</span>
      </div>
      <div class="io-row" style="margin-top:14px;">
        <span class="io-key">Output</span>
        <span class="badge true">True</span>
      </div>
    </div>

    <!-- Example 2 -->
    <div class="example-card ex2">
      <div class="ex-label">Example 2</div>
      <div class="io-row">
        <span class="io-key">P =</span>
        <span class="io-val">AABA</span>
      </div>
      <div class="io-row">
        <span class="io-key">Q =</span>
        <span class="io-val">AA</span>
      </div>
      <div class="io-row" style="margin-top:14px;">
        <span class="io-key">Output</span>
        <span class="badge false">False</span>
      </div>
    </div>

  </div>

  <!-- Interactive Playground -->
  <div class="playground">
    <div class="playground-title">// Try it yourself</div>

    <div class="input-row">
      <div class="field">
        <label>P — Input String</label>
        <input type="text" id="inputP" placeholder="e.g. AAAB" maxlength="40" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label>Q — Pattern</label>
        <input type="text" id="inputQ" placeholder="e.g. A+B" maxlength="40" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <button class="run-btn" onclick="runMatch()">▶ &nbsp; Run Matching</button>

    <div class="result-panel" id="resultPanel">
      <div class="result-top">
        <span class="result-label">Result</span>
        <span class="badge" id="resultBadge"></span>
      </div>
      <div class="result-explanation" id="resultExplanation"></div>
      <div class="steps" id="stepsList"></div>
    </div>
  </div>

</div>

<script>
/* ─── Validation ─────────────────────────────────────────────── */
function isValidPattern(q) {
  if (q.length === 0) return false;
  // '+' cannot appear at the start or after another '+'
  for (let i = 0; i < q.length; i++) {
    const ch = q[i];
    if (ch === '+') {
      if (i === 0) return false;           // leading +
      if (q[i - 1] === '+') return false;  // consecutive ++
    } else if (!/[A-Z]/.test(ch)) {
      return false;  // not uppercase letter, not +
    }
  }
  return true;
}

/* ─── Matching logic (DP-based) ──────────────────────────────── */
function regexMatch(p, q) {
  const n = p.length, m = q.length;
  // dp[i][j] = can p[0..i-1] be matched by q[0..j-1]
  const dp = Array.from({length: n + 1}, () => new Array(m + 1).fill(false));
  dp[0][0] = true;

  for (let i = 0; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      const qc = q[j - 1];
      if (qc === '+') {
        // '+' means 1+ of q[j-2]
        const prev = q[j - 2];
        // Must have consumed at least one prev character from p
        if (i >= 1 && p[i - 1] === prev) {
          // either it matches exactly one (dp[i-1][j-2]) or extends (dp[i-1][j])
          dp[i][j] = dp[i - 1][j - 2] || dp[i - 1][j];
        }
      } else {
        // literal character
        if (i >= 1 && p[i - 1] === qc) {
          dp[i][j] = dp[i - 1][j - 1];
        }
      }
    }
  }
  return dp[n][m];
}

/* ─── Build human-readable steps ─────────────────────────────── */
function buildSteps(p, q) {
  const tokens = [];
  let i = 0;
  while (i < q.length) {
    if (i + 1 < q.length && q[i + 1] === '+') {
      tokens.push({ ch: q[i], plus: true });
      i += 2;
    } else {
      tokens.push({ ch: q[i], plus: false });
      i += 1;
    }
  }
  return tokens;
}

/* ─── Main runner ────────────────────────────────────────────── */
function runMatch() {
  const p = document.getElementById('inputP').value.trim().toUpperCase();
  const q = document.getElementById('inputQ').value.trim().toUpperCase();

  const panel = document.getElementById('resultPanel');
  const badge = document.getElementById('resultBadge');
  const expl  = document.getElementById('resultExplanation');
  const steps = document.getElementById('stepsList');

  panel.classList.remove('visible');

  // — Validation
  if (!/^[A-Z]+$/.test(p)) {
    show('invalid', 'Invalid Pattern', 'P must contain only uppercase English letters (A–Z).', []);
    return;
  }
  if (!isValidPattern(q)) {
    show('invalid', 'Invalid Pattern',
      'Q has invalid syntax. Rules: only uppercase A–Z and "+"; "+" cannot be the first character or follow another "+".', []);
    return;
  }

  const result = regexMatch(p, q);
  const tokens = buildSteps(p, q);

  const tokenStrs = tokens.map(t => t.plus ? `${t.ch}+ (one or more '${t.ch}')` : `'${t.ch}'`);
  const explanation = result
    ? `Pattern "${q}" decomposes into: ${tokenStrs.join(', ')}. This fully covers the string "${p}".`
    : `Pattern "${q}" decomposes into: ${tokenStrs.join(', ')}. This does NOT fully cover the string "${p}".`;

  const chipData = tokens.map(t => ({
    label: t.plus ? `${t.ch}+` : t.ch,
    match: result
  }));

  show(result ? 'true' : 'false', result ? 'True' : 'False', explanation, chipData);
}

function show(type, label, explanation, chips) {
  const panel = document.getElementById('resultPanel');
  const badge = document.getElementById('resultBadge');
  const expl  = document.getElementById('resultExplanation');
  const steps = document.getElementById('stepsList');

  badge.className = 'badge ' + type;
  badge.textContent = label;
  expl.textContent = explanation;

  steps.innerHTML = chips.map(c =>
    `<span class="step-chip ${c.match ? 'match' : ''}">${c.label}</span>`
  ).join('');

  panel.classList.add('visible');
}

// Allow Enter key to trigger run
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') runMatch();
});
</script>
</body>
</html>
